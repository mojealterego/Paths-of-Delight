plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mojealterego.pathsofdelight.preview'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mojealterego.pathsofdelight.preview'
        minSdk 25
        targetSdk 36
        versionCode 1
        versionName '0.1.0-preview'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
